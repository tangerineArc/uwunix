[config]

[templates.btop]
input_path = "~/.dotfiles/config/matugen/templates/btop.theme"
output_path = "~/.cache/matugen/btop.theme"
post_hook = 'pkill -USR2 btop || true'

[templates.chromium]
input_path = "~/.dotfiles/config/matugen/templates/chromium-theme.json"
output_path = "~/.cache/matugen/chromium-theme.json"

[templates.fuzzel]
input_path = "~/.dotfiles/config/matugen/templates/fuzzel.ini"
output_path = "~/.cache/matugen/fuzzel.ini"

[templates.ghostty]
input_path = "~/.dotfiles/config/matugen/templates/colors.ghostty"
output_path = "~/.cache/matugen/colors.ghostty"
post_hook = 'pkill -SIGUSR2 ghostty'

[templates.gtk3]
input_path = "~/.dotfiles/config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/colors.css"
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = "~/.dotfiles/config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/colors.css"
post_hook = "bash ~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh"

[templates.niri]
input_path = "~/.dotfiles/config/matugen/templates/niri.kdl"
output_path = "~/.cache/matugen/niri.kdl"
